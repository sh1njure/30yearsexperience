name: Build & publish Docker image

# Builds the turnkey PrestaShop + combinationdescriptions image and pushes it to
# the GitHub Container Registry (GHCR), so `docker compose up` can pull it.
#
# NOTE: after the first successful run, make the package public if you want the
# one-liner to work without `docker login`:
#   GitHub -> your profile/org -> Packages -> 30yearsexperience -> Package
#   settings -> Change visibility -> Public.

on:
  push:
    branches:
      - main
      - claude/prestashop-combination-descriptions-9mo86z
    tags:
      - 'v*'
    paths:
      - 'combinationdescriptions/**'
      - 'docker/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
