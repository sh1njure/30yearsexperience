# Turnkey PrestaShop 8.2.3 + combinationdescriptions module.
#
#   docker compose up -d
#
# Then open http://localhost:8080 (shop) / http://localhost:8080/admin1 (BO).
# The module is enabled automatically once PrestaShop finishes installing.
#
# This file PULLS the prebuilt image from GHCR. To build it locally instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  mysql:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: prestashop
      MYSQL_DATABASE: prestashop
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  prestashop:
    image: ghcr.io/sh1njure/30yearsexperience:latest
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_SERVER: mysql
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: prestashop
      DB_PREFIX: ps_
      PS_INSTALL_AUTO: 1
      PS_ERASE_DB: 0
      PS_DEV_MODE: 0
      PS_DOMAIN: localhost:8080
      PS_FOLDER_ADMIN: admin1
      PS_FOLDER_INSTALL: install
      PS_LANGUAGE: en
      PS_COUNTRY: us
      ADMIN_MAIL: admin@example.com
      ADMIN_PASSWD: prestashop123
    ports:
      - "8080:80"
    volumes:
      - ps_data:/var/www/html
    restart: unless-stopped

  # One-shot: waits for the shop to install, then enables the module and exits.
  module-installer:
    image: ghcr.io/sh1njure/30yearsexperience:latest
    depends_on:
      - prestashop
    entrypoint: ["/usr/local/bin/install-module.sh"]
    volumes:
      - ps_data:/var/www/html
    restart: "no"

volumes:
  db_data:
  ps_data:
